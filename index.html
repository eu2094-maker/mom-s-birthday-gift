<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Mom! (Retro Edition)</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3e9d8;--ink:#4a4458;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a24;--ink:#cfc8e0}}
:root[data-theme="dark"]{--bg:#1d1a24;--ink:#cfc8e0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:"Press Start 2P","Courier New",monospace;user-select:none;-webkit-user-select:none}
#gb{width:min(calc(100vw - 24px),360px);background:#dfc3b4;border-radius:14px 14px 56px 14px;padding:18px 18px 20px;box-shadow:inset -4px -4px 0 #bf9d8e,inset 3px 3px 0 #f0ddd1,0 10px 30px rgba(0,0,0,.35);touch-action:none}
#bez{background:#9a766c;border-radius:8px 8px 28px 8px;padding:14px 18px 8px}
canvas{display:block;width:100%;aspect-ratio:160/144;image-rendering:pixelated;background:#d4eaff}
#ctl{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:#6b6580}
.dp{display:flex;gap:6px}
.dp button,#a{font-family:inherit;border:0;color:#fff;cursor:pointer;touch-action:none}
.dp button{width:50px;height:46px;background:#7a4f48;border-radius:8px;font-size:16px;box-shadow:0 3px 0 #4a2e2a}
#a{width:60px;height:60px;border-radius:50%;background:#b5254f;font-size:14px;box-shadow:0 4px 0 #6e1230}
button:active{transform:translateY(2px)}
</style>
</head>
<body>
<div id="gb">
 <div id="bez"><canvas id="c" width="160" height="144"></canvas></div>
 <div id="ctl"><div class="dp"><button id="L">◀</button><button id="R">▶</button></div><button id="a">A</button></div>
</div>
<script>
// ✏️ Make it hers — edit these:
var NAME="MOM";
var GOAL=15;
var MEMS=["I MISS EATING CANES WITH YOU","REMEMBER COSTCO SHOPPING AND GOSSIP?"];
var FINAL="THANK YOU FOR HELPING WITH ALL MY INCONVENIENT TRAVELING. I LOVE YOU!";

var cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=160,H=144;
ctx.imageSmoothingEnabled=false;
var D="#06203a",M="#2a6199",L="#7fb4e0",BG="#d4eaff";
var SP={
heart:[".dd..dd.","dmmddmmd","dmmmmmmd","dmmmmmmd",".dmmmmd.","..dmmd..","...dd...","........"],
cake:["..d..d..","..m..m..",".dddddd.",".dmmmmd.",".dddddd.",".dmmmmd.",".dddddd.","........"],
gift:["..dd.dd.","...dmd..","dddddddd","dmmdmmmd","dddddddd","dmmdmmmd","dmmdmmmd","dddddddd"],
star:["...dd...","...dd...","dddmmddd",".dmmmmd.","..dmmd..",".dmddmd.",".d....d.","........"],
bee:["d.dddd.d",".dmdmdd.","dddddddd",".dmdmdm.","..dddd..","...dd...","........","........"]};
var spr={};
for(var k in SP){var o=document.createElement("canvas");o.width=o.height=8;var x=o.getContext("2d");
 SP[k].forEach(function(r,y){for(var i=0;i<8;i++){var ch=r[i];if(ch!=".")x.fillStyle=ch=="d"?D:ch=="m"?M:L,x.fillRect(i,y,1,1)}});spr[k]=o}
var GOODS=[["heart",1],["heart",1],["star",1],["gift",2],["cake",3]];

var state="title",px=W/2,tx=W/2,score=0,lives=3,items=[],pops=[],conf=[],spawn=0,last=0,time=0,page=0,winT=0,hL=0,hR=0,keys={};
var pages=[];

var AC=null;
function tone(f,d,dl,v){if(!AC)return;var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(dl||0);
 o.type="square";o.frequency.value=f;g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
function jingle(){var n=[392,392,440,392,523,494,392,392,440,392,587,523];var dur=[.2,.2,.4,.4,.4,.7,.2,.2,.4,.4,.4,.7];var t=0;
 n.forEach(function(f,i){tone(f,dur[i]*.9,t,.07);t+=dur[i]*.9+.05})}

function start(){state="play";score=0;lives=3;items=[];pops=[];conf=[];spawn=.4;tone(523,.1,0);tone(784,.15,.1)}
function act(){
 if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
 if(state==="title"||state==="lose")start();
 else if(state==="win"&&time-winT>.5){page++;tone(660,.08,0);if(page>=pages.length){state="title"}}
}
function finish(win){
 if(win){state="win";winT=time;page=0;
  pages=["LEVEL CLEAR!\n\nMAKE A WISH, "+NAME+"!"].concat(MEMS.map(function(m,i){return "MEMORY LANE "+(i+1)+"/"+MEMS.length+"\n\n"+m})).concat(["HAPPY BIRTHDAY, "+NAME+"!\n"+FINAL]);
  for(var i=0;i<60;i++)conf.push({x:Math.random()*W,y:-Math.random()*H,v:20+Math.random()*30,c:i%2?D:M});
  jingle()}
 else{state="lose";tone(196,.25,0,.08);tone(147,.35,.25,.08)}
}

function setX(e){var r=cv.getBoundingClientRect();tx=(e.clientX-r.left)/r.width*W}
cv.addEventListener("pointermove",setX);
cv.addEventListener("pointerdown",function(e){if(state==="play")setX(e);else act()});
document.getElementById("a").addEventListener("pointerdown",act);
function hold(id,f){var b=document.getElementById(id);b.addEventListener("pointerdown",function(){f(1)});["pointerup","pointerleave","pointercancel"].forEach(function(n){b.addEventListener(n,function(){f(0)})})}
hold("L",function(v){hL=v});hold("R",function(v){hR=v});
addEventListener("keydown",function(e){keys[e.key]=1;if(e.key===" "||e.key==="Enter"){e.preventDefault();act()}});
addEventListener("keyup",function(e){keys[e.key]=0});

function txt(s,x,y,al,col){ctx.font="8px 'Press Start 2P','Courier New',monospace";ctx.textBaseline="top";ctx.textAlign=al||"center";ctx.fillStyle=col||D;ctx.fillText(s,x,y)}
function wrap(s,max){var out=[];s.split("\n").forEach(function(p){if(!p){out.push("");return}var ln="";p.split(" ").forEach(function(w){if((ln+" "+w).trim().length>max){out.push(ln);ln=w}else ln=(ln+" "+w).trim()});out.push(ln)});return out}
function para(s,y){wrap(s,17).forEach(function(l,i){txt(l,W/2,y+i*11)})}
function box(){ctx.fillStyle=D;ctx.fillRect(3,3,W-6,H-6);ctx.fillStyle=BG;ctx.fillRect(5,5,W-10,H-10)}
function sp(n,x,y,s){ctx.drawImage(spr[n],Math.round(x),Math.round(y),8*(s||1),8*(s||1))}

function frame(ts){
 var dt=Math.min((ts-last)/1000||0,.05);last=ts;time+=dt;
 ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
 if(state==="play"){
  if(keys.ArrowLeft||keys.a||hL)tx-=110*dt;if(keys.ArrowRight||keys.d||hR)tx+=110*dt;
  tx=Math.max(10,Math.min(W-10,tx));
  spawn-=dt;
  if(spawn<=0){spawn=Math.max(.5,1.05-score*.025);
   var bad=Math.random()<.22,g=GOODS[Math.floor(Math.random()*GOODS.length)];
   items.push({x:8+Math.random()*(W-16),y:-8,vy:38+score*2.2+Math.random()*18,n:bad?"bee":g[0],bad:bad,p:g[1],ph:Math.random()*6})}
  for(var i=items.length-1;i>=0;i--){var it=items[i];it.y+=it.vy*dt;if(it.bad)it.x+=Math.sin(time*6+it.ph)*22*dt;
   if(it.y>H-26&&it.y<H-8&&Math.abs(it.x-px)<11){items.splice(i,1);
    if(it.bad){lives--;pops.push({x:it.x,y:it.y,s:"OUCH",a:1});tone(130,.2,0,.09);if(lives<=0)finish(false)}
    else{score+=it.p;pops.push({x:it.x,y:it.y,s:"+"+it.p,a:1});tone(880,.07,0);tone(1175,.09,.06);if(score>=GOAL)finish(true)}}
   else if(it.y>H)items.splice(i,1)}
 }
 px+=(tx-px)*Math.min(1,dt*18);
 // ground + basket
 ctx.fillStyle=M;ctx.fillRect(0,H-6,W,6);ctx.fillStyle=D;ctx.fillRect(0,H-6,W,1);
 if(state==="play"||state==="lose"){
  items.forEach(function(it){sp(it.n,it.x-4,it.y-4)});
  var bx=Math.round(px-8);ctx.fillStyle=D;ctx.fillRect(bx,H-20,16,2);ctx.fillRect(bx+1,H-18,14,8);ctx.fillStyle=M;ctx.fillRect(bx+2,H-17,12,6);
  ctx.fillStyle=D;for(var j=0;j<4;j++)ctx.fillRect(bx+3+j*3,H-17,1,6);
  pops=pops.filter(function(p){p.y-=18*dt;p.a-=dt*1.3;if(p.a>0)txt(p.s,p.x,p.y-4,"center",D);return p.a>0});
 }
 if(state==="play"){
  txt(("0"+score).slice(-2)+"/"+GOAL,4,4,"left");
  for(var h=0;h<lives;h++)sp("heart",W-12-h*9,3);
 }
 if(state==="title"){
  box();txt("HAPPY",W/2,16);txt("BIRTHDAY",W/2,28);txt(NAME+"!",W/2,42);
  ctx.drawImage(spr.cake,W/2-16,60+Math.round(Math.sin(time*3)*2),32,32);
  sp("heart",24,66);sp("star",W-32,66);sp("gift",24,84);sp("heart",W-32,84);
  if(time%1<.65)txt("PRESS START",W/2,108);
  txt("(A / TAP / SPACE)",W/2,122,"center",M);
 }
 if(state==="lose"){box();sp("bee",W/2-12,24,3);txt("OH NO!",W/2,60);para("THE BEES GOT YOU.\nTRY AGAIN!",74);if(time%1<.65)txt("PRESS START",W/2,116)}
 if(state==="win"){
  conf.forEach(function(c){c.y+=c.v*dt;if(c.y>H)c.y=-4;ctx.fillStyle=c.c;ctx.fillRect(Math.round(c.x),Math.round(c.y),2,2)});
  ctx.fillStyle=D;ctx.fillRect(3,3,W-6,H-6);ctx.fillStyle=BG;ctx.fillRect(5,5,W-10,H-10);
  conf.forEach(function(c){ctx.fillStyle=c.c;ctx.fillRect(Math.round(c.x),Math.round(c.y),2,2)});
  var last_=page===pages.length-1;
  ctx.drawImage(spr[last_?"cake":(page===0?"star":"heart")],W/2-12,14+Math.round(Math.sin(time*4)*2),24,24);
  para(pages[page],last_?40:52);
  if(time%1<.65)txt(last_?"▶ PLAY AGAIN":"▶ NEXT",W/2,128);
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
